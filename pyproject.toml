[project]
name = "spinel"
version = "0.1.0"
description = "Strain Prediction IN Elastic Lattices"
authors = [
    {name = "James McHardy"}
]
requires-python = ">=3.12"
dependencies = [
    # Held at 1.60.x: streamlit's gzip middleware subclasses starlette's GZipResponder,
    # and the two must stay in step (see the starlette pin below and requirements.txt).
    "streamlit (>=1.60.0,<1.61.0)",
    "starlette (>=1.3.1,<1.4.0)",
    "lmfit (>=1.3.4,<2.0.0)",
    "scipy (>=1.17.0,<2.0.0)",
    "xlsxwriter (>=3.2.9,<4.0.0)",
    "pyfai (>=2025.12.1,<2026.0.0)",
    "pillow (>=12.2.0,<13.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "numpy (>=2.4.6,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "plotly (>=6.8.0,<7.0.0)",
    "odfpy (>=1.4.1,<2.0.0)"
]


[tool.poetry]
packages = [
    { include = "spinel.py", format = ["sdist", "wheel"] },
    { include = "PO.py", format = ["sdist", "wheel"] },
    { include = "cake_processing.py", format = ["sdist", "wheel"] },
    { include = "spinel_core.py", format = ["sdist", "wheel"] },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
